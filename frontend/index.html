<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Graphite</title>
		<!-- GraphX Studio fork (Track D, D1b, review round 1 / B6): the favicon/manifest
		     <link> tags that used to be here are removed, not just their files -- see
		     vite.config.ts's STATIC_ASSET_DIRS comment for why those files are no longer
		     shipped (branding/LICENSE.txt restriction). Leaving dead <link> tags pointing at
		     files that no longer exist would just add harmless-but-noisy 404s. -->
		<meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5, minimum-scale=0.5" />
		<meta name="apple-mobile-web-app-title" content="Graphite" />
		<meta name="application-name" content="Graphite" />
		<meta name="msapplication-TileColor" content="#ffffff" />
		<meta name="theme-color" content="#222222" />
		<meta name="color-scheme" content="dark only" />
		<meta name="darkreader-lock" />
		<meta name="description" content="Graphite is an open source vector graphics editor and procedural design engine. Create and animate with a nondestructive editing workflow that combines layer-based compositing with node-based generative design." />
		<meta name="mobile-web-app-capable" content="yes">
		<!-- INDEX_HTML_HEAD_REPLACEMENT -->
	</head>
	<body>
		<noscript>JavaScript is required</noscript>
		<style>
			body {
				height: 100%;
				margin: 0;
			}

			body::before {
				content: "";
				position: absolute;
				inset: 0;
				background: #222;
			}

			body::after {
				content: "";
				display: block;
				position: absolute;
				left: 50%;
				top: 50%;
				width: 60px;
				height: 60px;
				border-radius: 50%;
				border: 4px solid #eee;
				border-color: #eee transparent #eee transparent;
				animation: spinning-loading-indicator 1s linear infinite;

				@media (prefers-reduced-motion) {
					border: none;
					animation: none;
					content: "Loading…";
					font-family: Arial, sans-serif;
					font-size: 24px;
				}
			}

			@keyframes spinning-loading-indicator {
				0% {
					transform: translate(-30px, -30px) rotate(0deg);
				}
				100% {
					transform: translate(-30px, -30px) rotate(360deg);
				}
			}
		</style>
		<script type="module" src="src/main.ts"></script>
	</body>
</html>
